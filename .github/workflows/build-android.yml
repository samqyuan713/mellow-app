name: Build Android APK
 
on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:
 
jobs:
  build-apk:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
 
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
 
      # ── Generate the native Android project fresh every run ──
      # This means android/ never needs to be committed to git —
      # it's created here, built, then discarded after the workflow ends.
      - name: Add Capacitor Android platform
        working-directory: frontend
        run: npx cap add android
 
      - name: Sync web assets into Android project
        working-directory: frontend
        run: npx cap sync android
 
      - name: Grant execute permission for gradlew
        working-directory: frontend/android
        run: chmod +x gradlew
 
      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug
 
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mellow-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
